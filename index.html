<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>בינגו GIV 🎯</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0d2d52 0%, #1B4F8A 55%, #0d2d52 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 20px;
      gap: 16px;
    }

    .logo-wrap {
      background: white;
      border-radius: 16px;
      padding: 10px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    }

    .logo-wrap img {
      height: 60px;
      display: block;
    }

    h1 {
      color: #F26522;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      text-shadow: 0 0 24px rgba(242, 101, 34, 0.5);
      letter-spacing: 2px;
      text-align: center;
    }

    .subtitle {
      color: #c8d8ee;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      text-align: center;
      max-width: 420px;
      line-height: 1.5;
    }

    .subtitle strong { color: #F26522; }

    .warning {
      color: #ff6b6b;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      text-align: center;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.4);
      border-radius: 8px;
      padding: 8px 18px;
    }

    .counter {
      color: #a8c4e0;
      font-size: 0.9rem;
    }

    .counter span {
      color: #F26522;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: min(92vw, 520px);
    }

    .cell {
      background: rgba(255, 255, 255, 0.07);
      border: 2px solid rgba(242, 101, 34, 0.25);
      border-radius: 12px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      cursor: pointer;
      color: #ddeeff;
      font-size: clamp(0.58rem, 1.8vw, 0.82rem);
      font-weight: 600;
      line-height: 1.3;
      transition: all 0.2s ease;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .cell:hover:not(.marked) {
      background: rgba(242, 101, 34, 0.15);
      border-color: rgba(242, 101, 34, 0.7);
      transform: scale(1.04);
    }

    .cell.marked {
      background: linear-gradient(135deg, #F26522, #d4521a);
      border-color: #F26522;
      color: #fff;
      transform: scale(1.02);
      box-shadow: 0 0 18px rgba(242, 101, 34, 0.6);
    }

    .cell.marked::after {
      content: '✓';
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: 0.75rem;
      font-weight: 900;
      opacity: 0.8;
    }

    .cell.pop-anim {
      animation: cellPop 0.28s ease;
    }

    @keyframes cellPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.18); }
      100% { transform: scale(1.02); }
    }

    .btn {
      background: transparent;
      border: 2px solid #F26522;
      color: #F26522;
      padding: 10px 28px;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      font-weight: 700;
    }

    .btn:hover {
      background: #F26522;
      color: #fff;
    }

    /* יא שועל popup */
    #shual-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      background: linear-gradient(135deg, #F26522, #d4521a);
      color: white;
      font-size: clamp(1.6rem, 6vw, 2.8rem);
      font-weight: 900;
      padding: 20px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(242,101,34,0.7);
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: none;
      white-space: nowrap;
    }

    #shual-popup.show {
      animation: shualPop 1.1s ease forwards;
    }

    @keyframes shualPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-6deg); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(3deg); }
      35%  { transform: translate(-50%, -50%) scale(0.95) rotate(-1deg); }
      50%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      75%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
    }

    /* Win overlay */
    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 20, 50, 0.92);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #win-overlay.show { display: flex; }

    .win-title {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: 900;
      color: #F26522;
      text-shadow: 0 0 40px rgba(242, 101, 34, 0.9);
      animation: pulse 0.8s ease infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.08); }
    }

    .win-sub {
      color: #c8d8ee;
      font-size: clamp(1rem, 3vw, 1.3rem);
      text-align: center;
      line-height: 1.6;
    }

    .win-images {
      display: flex;
      gap: 24px;
      align-items: flex-end;
      justify-content: center;
    }

    .win-images img {
      width: clamp(100px, 25vw, 200px);
      animation: bounce 0.6s ease infinite alternate;
    }

    .win-images img:nth-child(2) { animation-delay: 0.3s; }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-14px); }
    }

    .confetti-piece {
      position: fixed;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="GIV LOGO.webp" alt="GIV Solutions" />
  </div>

  <h1>🎯 בינגו אילון</h1>
  <p class="subtitle">סמן כל משבצת שאילון אומר את הביטוי. מי שמשלים את כל הלוח — צועק <strong>BINGO!</strong></p>
  <p class="warning">🤫 <strong>אסור שאילון ידע שיש משחק!</strong> 🤫</p>

  <p class="counter">סומנו: <span id="count">0</span> / 16</p>

  <div class="board" id="board"></div>

  <button class="btn" onclick="newBoard()">🔀 לוח חדש</button>

  <div id="shual-popup">יא שועל!!!</div>

  <div id="win-overlay">
    <div class="win-title">🎉 BINGO! 🎉</div>
    <p class="win-sub">כל הכבוד! סימנת את כל הלוח!<br>סימן שאתה מכיר את אילון מצויין 😄</p>
    <div class="win-images">
      <img src="de8db74a-8a4d-49af-bc67-ce6029a7b4e4.webp" alt="אילון" />
      <img src="7b91479c-5748-4acd-99ac-e0c932ee05bc.webp" alt="אילון" />
    </div>
    <button class="btn" onclick="newBoard(); closeWin();">לוח חדש</button>
  </div>

  <script>
    const phrases = [
      'לא מאיימים על יונה עם יין',
      'זה שקוף לי',
      'נתיב שול עמוד תאורה',
      'לעשות לב עם הידיים',
      'אה כפרה',
      'הכנה למזגן',
      'גנרי',
      'קמפוס',
      'חייקה',
      'נשמה',
      'תוביל',
      'כתפיסה',
      'זה המשחק',
      'לך תחפש',
      'שועל',
      'חי את החלום',
      'בשיא שלי',
      'פער',
      'צחקיש'
    ];

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function newBoard() {
      const board = document.getElementById('board');
      const selected = shuffle(phrases).slice(0, 16);
      board.innerHTML = '';
      selected.forEach((text, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = text;
        cell.dataset.index = i;
        cell.addEventListener('click', () => toggle(cell));
        board.appendChild(cell);
      });
      updateCount();
    }

    let shualTimeout = null;

    function showShual() {
      const popup = document.getElementById('shual-popup');
      popup.classList.remove('show');
      void popup.offsetWidth; // reflow to restart animation
      popup.classList.add('show');
      clearTimeout(shualTimeout);
      shualTimeout = setTimeout(() => popup.classList.remove('show'), 1100);
    }

    function toggle(cell) {
      cell.classList.toggle('marked');
      if (cell.classList.contains('marked')) {
        cell.classList.add('pop-anim');
        cell.addEventListener('animationend', () => cell.classList.remove('pop-anim'), { once: true });
        showShual();
      }
      updateCount();
      checkWin();
    }

    function updateCount() {
      const marked = document.querySelectorAll('.cell.marked').length;
      document.getElementById('count').textContent = marked;
    }

    function checkWin() {
      const total = document.querySelectorAll('.cell').length;
      const marked = document.querySelectorAll('.cell.marked').length;
      if (marked === total) {
        spawnConfetti();
        setTimeout(() => {
          document.getElementById('win-overlay').classList.add('show');
        }, 400);
      }
    }

    function closeWin() {
      document.getElementById('win-overlay').classList.remove('show');
    }

    function spawnConfetti() {
      const colors = ['#F26522', '#1B4F8A', '#ffffff', '#ffb347', '#4ecdc4', '#ff6b6b'];
      for (let i = 0; i < 90; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.cssText = `
          left: ${Math.random() * 100}vw;
          background: ${colors[Math.floor(Math.random() * colors.length)]};
          animation-duration: ${1.5 + Math.random() * 2}s;
          animation-delay: ${Math.random() * 0.5}s;
          width: ${6 + Math.random() * 8}px;
          height: ${6 + Math.random() * 8}px;
        `;
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    newBoard();
  </script>
</body>
</html>
